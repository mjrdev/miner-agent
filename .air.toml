root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "migrations", "openspec", ".claude", ".agents"]
  exclude_regex = ["_test\\.go$"]
  # inotify events do not cross bind mounts reliably on WSL2/Docker Desktop.
  poll = true
  poll_interval = 500
  delay = 200
  # Let the service shut down gracefully on each reload.
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
