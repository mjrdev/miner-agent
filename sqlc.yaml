version: "2"
sql:
  - engine: postgresql
    schema: migrations/
    queries: internal/task/postgres/queries/
    gen:
      go:
        package: sqlcdb
        out: internal/task/postgres/sqlcdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
  - engine: postgresql
    schema: migrations/
    queries: internal/execution/run/postgres/queries/
    gen:
      go:
        package: sqlcdb
        out: internal/execution/run/postgres/sqlcdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int
              pointer: true
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
